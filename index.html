<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title id="page-title">ご結婚式 | デジタル席次表</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shrikhand&family=Zen+Maru+Gothic:wght@400;500;700&family=Yusei+Magic&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ============ SPLASH (gate) ============ -->
<section id="splash" class="splash">
  <div id="splash-media" class="splash-media"></div>
  <div class="splash-overlay"></div>
  <div class="splash-content">
    <p class="splash-welcome">Welcome to<br>our Wedding Reception</p>
    <p class="splash-names" id="splash-names"></p>
    <p class="splash-tagline" id="splash-tagline"></p>
    <p class="splash-date" id="splash-date"></p>
  </div>
  <div class="splash-actions">
    <button type="button" id="splash-skip" class="splash-skip">skip</button>
    <button type="button" id="splash-stop" class="splash-skip splash-stop">stop</button>
  </div>
</section>

<!-- ============ fixed index toggle ============ -->
<button type="button" id="index-toggle" class="index-toggle" aria-label="INDEX" hidden>
  <span></span><span></span><span></span>
</button>

<!-- ============ fixed back button ============ -->
<button type="button" id="back-toggle" class="back-toggle" aria-label="トップへ戻る" data-nav="top" hidden>&larr;</button>

<!-- ============ slide-in index panel ============ -->
<div id="index-panel" class="index-panel" hidden>
  <div class="index-panel-backdrop" data-close-index></div>
  <nav class="index-panel-sheet">
    <button type="button" class="modal-close" data-close-index aria-label="閉じる">×</button>
    <p class="index-panel-title">INDEX</p>
    <ol class="index-list" id="index-list-panel"></ol>
  </nav>
</div>

<!-- ============ MAIN ============ -->
<main id="app" hidden>

  <!-- TOP -->
  <section class="page section-top-compact" id="top" data-page="top">
    <div class="top-hero">
      <img class="top-photo-full" src="assets/img/kimono.jpg" alt="">
      <div class="top-hero-overlay">
        <p class="top-greeting-label">Greeting</p>
        <div id="top-message" class="top-message"></div>
      </div>
    </div>
    <nav class="top-nav-grid" id="nav-grid-top"></nav>
  </section>

  <!-- GROOM (profile + personal history) -->
  <section class="page section" id="groom" data-page="groom" hidden>
    <p class="section-eyebrow">02</p>
    <h2 class="section-title" data-title-for="groom"></h2>

    <div class="profile-person">
      <div class="profile-header">
        <p class="profile-header-en">Profile</p>
        <p class="profile-header-jp" id="profile-groom-name"></p>
      </div>
      <div id="profile-groom-photo"></div>
      <div id="profile-groom-stats" class="profile-stats"></div>
    </div>

    <div class="profile-header">
      <p class="profile-header-en">History</p>
      <p class="profile-header-jp">生い立ち</p>
    </div>
    <div id="history-groom-timeline" class="profile-timeline"></div>

    <nav class="profile-nav-grid" id="nav-grid-groom"></nav>
  </section>

  <!-- BRIDE (profile + personal history) -->
  <section class="page section" id="bride" data-page="bride" hidden>
    <p class="section-eyebrow">03</p>
    <h2 class="section-title" data-title-for="bride"></h2>

    <div class="profile-person">
      <div class="profile-header">
        <p class="profile-header-en">Profile</p>
        <p class="profile-header-jp" id="profile-bride-name"></p>
      </div>
      <div id="profile-bride-photo"></div>
      <div id="profile-bride-stats" class="profile-stats"></div>
    </div>

    <div class="profile-header">
      <p class="profile-header-en">History</p>
      <p class="profile-header-jp">生い立ち</p>
    </div>
    <div id="history-bride-timeline" class="profile-timeline"></div>

    <nav class="profile-nav-grid" id="nav-grid-bride"></nav>
  </section>

  <!-- OUR HISTORY (the couple's story) -->
  <section class="page section" id="our-history" data-page="our-history" hidden>
    <p class="section-eyebrow">04</p>
    <h2 class="section-title" data-title-for="our-history"></h2>
    <div id="our-history-timeline" class="profile-timeline"></div>
    <nav class="profile-nav-grid" id="nav-grid-our-history"></nav>
  </section>

  <!-- SEATING LIST -->
  <section class="page section" id="seating" data-page="seating" hidden>
    <p class="section-eyebrow">05</p>
    <h2 class="section-title" data-title-for="seating"></h2>

    <!-- 全体座席図（印刷席次表風レイアウト） -->
    <h3 class="carousel-title">全体座席図</h3>
    <div class="full-chart-scroll">
      <div class="full-chart" id="full-chart"></div>
    </div>

    <nav class="profile-nav-grid" id="nav-grid-seating"></nav>
  </section>

  <!-- MENU -->
  <section class="page section" id="menu" data-page="menu" hidden>
    <p class="section-eyebrow">06</p>
    <h2 class="section-title" data-title-for="menu"></h2>
    <div id="food-list" class="course-list-flat"></div>
    <p class="section-caption">※アレルギー等ございましたら受付までお申し付けください</p>

    <nav class="profile-nav-grid" id="nav-grid-menu"></nav>
  </section>

  <!-- Q&A (お互いへの質問と回答) -->
  <section class="page section" id="qa" data-page="qa" hidden>
    <p class="section-eyebrow">07</p>
    <h2 class="section-title" data-title-for="qa"></h2>
    <div id="qa-list" class="qa-list"></div>
    <div id="qa-rankings" class="qa-rankings"></div>

    <nav class="profile-nav-grid" id="nav-grid-qa"></nav>
  </section>

  <!-- RECOMMENDED MAP (新郎新婦の思い出の場所) -->
  <section class="page section" id="map" data-page="map" hidden>
    <p class="section-eyebrow">08</p>
    <h2 class="section-title" data-title-for="map"></h2>
    <p class="map-intro" id="map-intro"></p>

    <!-- 12の場所ボタン（3列×4段） -->
    <div class="map-spot-grid" id="map-spot-grid"></div>

    <!-- 富山県地図（Leaflet） -->
    <div id="toyama-map" class="toyama-map"></div>

    <!-- 選んだ場所の説明（ふたりの写真＋紹介文） -->
    <div id="map-spot-desc" class="map-spot-desc" hidden></div>

    <button type="button" class="to-top-btn" data-scroll-top>&uarr; ページ上部へ</button>
    <nav class="profile-nav-grid" id="nav-grid-map"></nav>
  </section>

  <footer class="footer">
    <p id="footer-text"></p>
  </footer>

</main>

<!-- ============ GUEST DETAIL MODAL ============ -->
<div id="guest-modal" class="modal" hidden>
  <div class="modal-backdrop" data-close></div>
  <div class="modal-sheet" role="dialog" aria-modal="true">
    <button type="button" class="modal-close" data-close aria-label="閉じる">×</button>
    <div id="guest-modal-body"></div>
  </div>
</div>

<!-- ============ PHOTO LIGHTBOX MODAL (おすすめマップの写真拡大) ============ -->
<div id="photo-modal" class="modal" hidden>
  <div class="modal-backdrop" data-close></div>
  <div class="modal-sheet" role="dialog" aria-modal="true">
    <button type="button" class="modal-close" data-close aria-label="閉じる">×</button>
    <div id="photo-modal-body"></div>
  </div>
</div>

<!-- ============ SEATING HINT POPUP (お座席ページを開いた時の案内) ============ -->
<div id="seating-hint-modal" class="modal" hidden>
  <div class="modal-backdrop" data-close></div>
  <div class="modal-sheet" role="dialog" aria-modal="true">
    <button type="button" class="modal-close" data-close aria-label="閉じる">×</button>
    <p class="seating-hint-text">👆<br>お名前をタップすると<br>ご紹介が表示されます</p>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
